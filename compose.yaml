services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay_local
      POSTGRES_DB: nexapay
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nexapay_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  nexapay_data:
